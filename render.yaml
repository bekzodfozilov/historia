# Render Blueprint — static frontend (React + Vite)
services:
  - type: web
    name: historia
    runtime: static
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback so deep links like /countries/uzb work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
